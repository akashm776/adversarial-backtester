name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
      - run: uv build
      - run: uv run adversarial-backtest --n-prices 120 --n-permutations 39 --output artifacts/smoke.json
