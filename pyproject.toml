[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adversarial-backtester"
version = "0.1.0"
description = "Causal, cost-aware walk-forward evaluation for skeptical signal research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
adversarial-backtest = "adversarial_backtester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adversarial_backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.coverage.run]
source = ["adversarial_backtester"]
branch = true
